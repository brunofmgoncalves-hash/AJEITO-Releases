<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AJEITO — Instalação Beta</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0A1A3A;background:#F7F9FC}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F7F9FC}
.card{width:min(560px,100%);background:#fff;border:1px solid #DCE3EC;border-radius:20px;padding:28px}
h1{margin:0 0 6px}.sub{color:#667085;margin-bottom:22px}.status{padding:14px;border-radius:12px;background:#F2F4F7;color:#475467}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;margin-top:14px;border-radius:12px;background:#0A1A3A;color:#fff;text-decoration:none;font-weight:700}
.btn[hidden]{display:none}.meta{font-size:12px;color:#667085;margin-top:10px}.small{font-size:12px;color:#667085;line-height:1.5;margin-top:16px}
</style>
</head>
<body><main class="card">
<h1>AJEITO</h1><div class="sub">Tablet Android — Beta</div>
<div id="status" class="status">A verificar a versão disponível...</div>
<div id="meta" class="meta"></div>
<a id="download" class="btn" href="#" hidden>Instalar AJEITO Tablet</a>
<div class="small">Nesta fase pode ser necessário autorizar a instalação de aplicações externas no Android. Quando a distribuição passar para a Google Play, este passo deixa de ser necessário.</div>
</main>
<script>
(async()=>{
 const s=document.getElementById('status'), b=document.getElementById('download'), m=document.getElementById('meta');
 try{
  const r=await fetch('../updates/tablet-android/staging.json?t='+Date.now(),{cache:'no-store'});
  const d=await r.json();
  if(d.available && d.url){
   b.href=d.url;b.hidden=false;b.textContent='Instalar AJEITO Tablet '+(d.version?('v'+d.version):'');
   s.textContent='Versão Beta disponível.';
   m.textContent=(d.version?'Versão '+d.version:'')+(d.build?' · build '+d.build:'');
  }else{
   s.textContent=d.message||'Ainda não existe versão Android publicada.';
  }
 }catch(e){s.textContent='Não foi possível verificar a versão neste momento.'}
})();
</script></body></html>
